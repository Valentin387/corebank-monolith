spring:
  application:
    name: monolith
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/corebank
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  redis:
    host: localhost
    port: 6379
    password: ""
